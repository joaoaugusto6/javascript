<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Pro</title>

<style>
:root {
    --bg: #1e1e1e;
    --panel: #2c2c2c;
    --text: #fff;
    --btn: #353535;
    --operator: #ff9500;
}

.light {
    --bg: #a8a8a8;
    --panel: #e7e7e7;
    --text: #000;
    --btn: #cfcfcf;
    --operator: #0099ff;
}

body {
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 97vh;
    font-family: Arial;
    transition: 0.3s;
}

.calculator {
    background: var(--panel);
    padding: 20px;
    border-radius: 15px;
    width: 350px;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

#display {
    width: 94%;
    height: 50px;
    font-size: 22px;
    text-align: right;
    margin-bottom: 10px;
    padding: 10px;
    border: none;
    margin-left: 0px;
    border-radius: 8px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

button {
    height: 50px;
    font-size: 18px;
    border: none;
    cursor: pointer;
    background: var(--btn);
    color: var(--text);
    border-radius: 8px;
}

.operator {
    background: var(--operator);
    grid-column: span 1;
    color: white;
}

#soma {
    grid-column: span 2;
}

.equal {
    grid-column: span 4;
    background: #03e23b;
    color: white;
    transition: background-color 0.2s color 0.2s;
}

.toggle {
    margin-bottom: 10px;
    width: 100%;
    height: 35px;
}

.history {
    margin-top: 10px;
    max-height: 100px;
    overflow-y: auto;
    font-size: 14px;
    background: rgba(0,0,0,0.1);
    padding: 5px;
    color: var(--text);
    text-align: center;
    font-size: 12pt;
}
</style>
</head>

<body>

<div class="calculator">
    <button class="toggle" onclick="toggleTheme()">Alternar Tema</button>
    <input type="text" id="display" readonly>

    <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button onclick="appendValue('%')">%</button>
        <button onclick="square()">x²</button>
        <button onclick="sqrt()">√</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="operator" id="soma" onclick="appendValue('+')">+</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>

    <div class="history" id="history"></div>
</div>

<script>
const display = document.getElementById("display");
const historyDiv = document.getElementById("history");

function appendValue(val) {
    display.value += val;
}

function clearDisplay() {
    display.value = "";
}

function calculate() {
    try {
        const expression = display.value;
        const result = Function('"use strict"; return (' + expression + ')')();
        addHistory(expression + " = " + result);
        display.value = result;
    } catch {
        display.value = "Erro";
    }
}

function square() {
    if(display.value !== ""){
        const result = Number(display.value) ** 2;
        addHistory(display.value + "² = " + result);
        display.value = result;
    }
}

function sqrt() {
    if(display.value !== ""){
        const result = Math.sqrt(Number(display.value));
        addHistory("√" + display.value + " = " + result);
        display.value = result;
    }
}

function addHistory(entry){
    const p = document.createElement("div");
    p.textContent = entry;
    historyDiv.prepend(p);
}

function toggleTheme(){
    document.body.classList.toggle("light");
}

document.addEventListener("keydown", function(event){
    if(!isNaN(event.key) || "+-*/.%".includes(event.key)){
        appendValue(event.key);
    } else if(event.key === "Enter"){
        calculate();
    } else if(event.key === "Backspace"){
        display.value = display.value.slice(0, -1);
    } else if(event.key === "Escape"){
        clearDisplay();
    }
});
</script>

</body>
</html>
